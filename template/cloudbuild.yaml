# Usage: gcloud builds submit --config template/cloudbuild.yaml --substitutions=_SERVER=<name>
substitutions:
  _SERVER: clinicaltrials
  _REGION: europe-west4
  _REPO: mcp-connectors
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - template/Dockerfile
      - --build-arg
      - SERVER=${_SERVER}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVER}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVER}:latest
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVER}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVER}:latest
options:
  logging: CLOUD_LOGGING_ONLY
